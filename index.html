<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Matriz de Fichamento · Tese da Carla Sofia</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <div class="container">
      <p class="eyebrow">Tese da Carla Sofia</p>
      <h1>Matriz de Fichamento</h1>
      <p class="lead">Navegue pelos registros em cards, filtre e pesquise na matriz de fichamento.</p>
      <div class="hero-links">
        <a class="btn" href="matriz_orientacoes_v2.xlsx" download>Baixar matriz (XLSX)</a>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="filters" aria-label="Filtros">
      <div class="field search">
        <label for="q">Busca</label>
        <input id="q" type="search" placeholder="ID, material, conhecimento, seção, evidência…">
      </div>
      <div class="field">
        <label for="programa">Programa</label>
        <select id="programa"><option value="">Todos</option></select>
      </div>
      <div class="field">
        <label for="volume">Volume</label>
        <select id="volume"><option value="">Todos</option></select>
      </div>
      <div class="field">
        <label for="sort">Ordenar</label>
        <select id="sort">
          <option value="id">ID da orientação</option>
          <option value="fonte">Programa / Volume / Seção</option>
        </select>
      </div>
      <div class="actions">
        <button id="clear" class="btn secondary" type="button">Limpar filtros</button>
      </div>
    </section>

    <div class="status-bar"><span id="count"></span></div>
    <section id="cards" class="cards" aria-live="polite"></section>
    <div id="empty" class="empty" hidden>Nenhum registro encontrado para os filtros selecionados.</div>
  </main>

  <footer class="footer container">
    <p><strong>Tese da Carla Sofia.</strong> Fonte: <a href="matriz_orientacoes_v2.xlsx">matriz_orientacoes_v2.xlsx</a>.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
